
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      TASKS_FILE: /data/tasks.json
    volumes:
      - task_data:/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  task_data:
