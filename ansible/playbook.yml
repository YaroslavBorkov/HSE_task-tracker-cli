
---
- name: Deploy Task Tracker
  hosts: docker_lab
  become: true

  vars:
    app_dir: /opt/task-tracker

  tasks:
    - name: Install required packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - python3-apt
        state: present
        update_cache: true

    - name: Create APT keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable"
        filename: docker
        state: present

    - name: Install Docker and Compose
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Start Docker service
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        mode: "0755"

    - name: Copy application directories
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../{{ item }}/"
        dest: "{{ app_dir }}/{{ item }}/"
      loop:
        - backend
        - frontend
        - src

    - name: Copy Compose configuration
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../compose.yaml"
        dest: "{{ app_dir }}/compose.yaml"
        mode: "0644"

    - name: Start application
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}"
        state: present
        build: always

    - name: Check Backend API
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/api/tasks
        status_code: 200
      register: api_check
      retries: 10
      delay: 3
      until: api_check.status == 200
